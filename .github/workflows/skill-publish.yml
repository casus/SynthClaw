name: Publish to ClawHub

on:
  release:
    types: [published]
  push:
    branches: [main]

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install ClawHub CLI
        run: npm install -g clawhub

      - name: Login and Publish
        env:
          CLAWHUB_TOKEN: ${{ secrets.CLAWHUB_TOKEN }}
        run: |
          if [[ -z "$CLAWHUB_TOKEN" ]]; then
            echo "::error::CLAWHUB_TOKEN secret is missing."
            exit 1
          fi
          clawhub login --token "$CLAWHUB_TOKEN" --no-browser
          
          if [[ "${{ github.event_name }}" == "release" ]]; then
            echo "Event is a release - publishing skill..."
            clawhub publish . --slug @casus/synthclaw
          else
            echo "Event is ${{ github.event_name }} - ran test validation successfully (skipped publishing)."
          fi
