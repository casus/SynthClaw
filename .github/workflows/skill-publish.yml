name: Publish to ClawHub

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    permissions:
      id-token: write
      contents: read
    uses: openclaw/clawhub/.github/workflows/skill-publish.yml@main
    with:
      skill_path: .
      owner: casus
      dry_run: false
    secrets:
      clawhub_token: ${{ secrets.CLAWHUB_TOKEN }}
